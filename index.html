.changes-section{background:#fff;border-radius:12px;border:1px solid #E5E3DE;overflow:hidden;}

.chg-name{font-weight:600;color:#111;flex-shrink:0;}
.chg-dept{color:#888;font-size:10px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.chg-lv{color:#bbb;font-size:10px;flex-shrink:0;margin-left:4px;}

.chg-summary{display:flex;gap:8px;padding:12px 20px;border-bottom:1px solid #F0EEE9;flex-wrap:wrap;}
.chg-sum-item{display:flex;align-items:center;gap:5px;font-size:12px;}
.chg-sum-badge{font-size:10px;font-weight:600;padding:2px 8px;border-radius:4px;}

.badge-leave2{background:#FEF3C7;color:#78350F;}.badge-return{background:#EFF6FF;color:#1E40AF;}
.chg-sum-num{font-weight:700;color:#111;}
.detail-header{padding:1.2rem 2rem 0.5rem;display:flex;align-items:center;gap:10px;}
.detail-title{font-size:16px;font-weight:700;color:#111;}
.detail-cnt{font-size:12px;color:#888;margin-top:2px;}
.back-btn{font-size:12px;font-weight:500;background:#F3F2EE;border:1px solid #E0DDD6;border-radius:6px;padding:5px 12px;cursor:pointer;color:#555;font-family:inherit;margin-left:auto;}
.back-btn:hover{background:#EAEAE6;}
.hint-bar{font-size:11px;color:#999;padding:8px 2rem 0;}
.leave-section{background:#fff;border-radius:12px;border:1px solid #E5E3DE;overflow:hidden;}
.leave-header{background:#FEF3C7;border-bottom:1px solid #FDE68A;padding:10px 20px;display:flex;align-items:center;gap:8px;}
.leave-header h2{font-size:13px;font-weight:600;color:#78350F;}
.lh-cnt{font-size:11px;font-weight:600;background:#F59E0B;color:#fff;border-radius:4px;padding:2px 8px;}
.leave-grid{display:flex;flex-wrap:wrap;gap:10px;padding:14px 20px;}
.leave-card{border:1px solid #FDE68A;border-left:3px solid #F59E0B;border-radius:7px;padding:9px 12px;background:#FFFBEB;min-width:155px;flex:0 0 auto;}
.lv-dept{font-size:10px;font-weight:700;color:#92400E;margin-bottom:3px;}
.lv-name{font-size:12px;font-weight:600;color:#111;margin-bottom:2px;}
.lv-meta{font-size:10px;color:#888;margin-bottom:4px;}

.detail-footer{margin:0 2rem 2rem;display:flex;flex-direction:column;gap:1rem;}
/* HC 탭 스타일 */
.hc-wrap{padding:1.5rem 2rem 2rem;}
.hc-controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:1.2rem;}
.hc-select{font-family:'Noto Sans KR',sans-serif;font-size:12px;padding:5px 10px;border:1px solid #E0DDD6;border-radius:6px;background:#fff;cursor:pointer;outline:none;}
.hc-select:focus{border-color:#60A5FA;}
.hc-label{font-size:12px;color:#888;margin-right:2px;}

.hc-sum-label{font-size:11px;color:#888;margin-bottom:4px;}
.hc-sum-val{font-size:20px;font-weight:700;color:#111;}
.hc-sum-delta{font-size:11px;margin-top:3px;}
.delta-up{color:#16A34A;}.delta-dn{color:#DC2626;}.delta-zero{color:#888;}
.hc-chart-wrap{background:#fff;border-radius:12px;border:1px solid #E5E3DE;padding:1.2rem 1.5rem 1rem;margin-bottom:1rem;position:relative;}
.hc-chart-title{font-size:13px;font-weight:600;color:#111;margin-bottom:0.8rem;}
.hc-chart-area{position:relative;height:220px;width:100%;}
.hc-memo-popup{display:none;position:absolute;z-index:50;background:#fff;border:1px solid #FDE68A;border-left:3px solid #F59E0B;border-radius:8px;padding:10px 14px;box-shadow:0 4px 16px rgba(0,0,0,0.12);max-width:260px;min-width:180px;}
.hc-memo-popup.visible{display:block;}
.hc-memo-popup-month{font-size:11px;font-weight:700;color:#92400E;margin-bottom:4px;}
.hc-memo-popup-text{font-size:11px;color:#444;line-height:1.5;}
.hc-close-popup{float:right;background:none;border:none;font-size:12px;color:#aaa;cursor:pointer;padding:0;}
.hc-table-wrap{background:#fff;border-radius:12px;border:1px solid #E5E3DE;overflow:hidden;margin-bottom:1rem;}
.hc-table-header{background:#F3F2EE;padding:10px 16px;font-size:12px;font-weight:600;color:#333;border-bottom:1px solid #E5E3DE;display:flex;align-items:center;justify-content:space-between;}
.hc-table{width:100%;border-collapse:collapse;font-size:11px;}
.hc-table th{background:#F8F7F4;padding:7px 8px;text-align:center;color:#666;font-weight:600;border-bottom:1px solid #E5E3DE;white-space:nowrap;font-size:10px;}
.hc-table th:first-child{text-align:left;min-width:130px;}
.hc-table td{padding:5px 8px;border-bottom:1px solid #F0EEE9;text-align:center;color:#333;font-size:11px;}
.hc-table td:first-child{text-align:left;}
.hc-table tr:last-child td{border-bottom:none;}
.hc-table tr.n1-row td{font-weight:700;}
.hc-table tr.n2-row td{font-size:10px;color:#555;}
.hc-table tr.n2-row td:first-child{padding-left:22px;color:#666;font-size:10px;}
.hc-table tr.n2-row td:first-child::before{content:"└ ";color:#bbb;}
.hc-table tr:hover td{background:#FAFAF8;}
.td-delta{font-size:9px;margin-left:2px;}
.fade-in{animation:fadeIn 0.2s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}
@media(max-width:800px){.chg-cols{grid-template-columns:repeat(2,1fr);}}
</style>
</head>
<body>
<div class="page-header">
  <div class="header-left">

function renderChangesGrid(c,gridId){
  const sec=document.getElementById(gridId).closest('.changes-section');
  if(!c){sec.classList.add('hidden');return;}
  sec.classList.remove('hidden');
  const sumId=gridId.replace('chg-cols','summary');
  const tabsId=gridId.replace('chg-cols','type-tabs');
  const prefix=gridId.split('-')[0];
  document.getElementById(sumId).innerHTML=CHG_TYPES.map(t=>{
    const cnt=(c[t.key]||[]).length;
    return '<div class="chg-sum-item"><span class="chg-sum-badge '+t.badge+'">'+t.icon+' '+t.label+'</span><span class="chg-sum-num">'+cnt+'명</span></div>';
  }).join('');
  let curType=CHG_TYPES[0].key;
  function renderCols(type){
    const typeData=c[type]||[];
    const groups={};
    typeData.forEach(r=>{const k=r.n2||'브랜드 공통';if(!groups[k])groups[k]=[];groups[k].push(r);});
    document.getElementById(gridId).innerHTML=N2_ORDER.map(n2=>{
      const items=groups[n2]||[];
      const col=N2_COLORS[n2]||{bg:'#F3F2EE',bd:'#C8C5BE',tx:'#444'};
      const ih=items.length>0?items.map(r=>'<div class="chg-item"><span class="chg-name">'+r.name+'</span><span class="chg-dept">'+r.dept+'</span><span class="chg-lv">'+r.level+'</span></div>').join(''):'<div class="no-change">없음</div>';
      return '<div class="chg-n2-col"><div class="chg-n2-head" style="background:'+col.bg+';color:'+col.tx+';border-bottom:1px solid '+col.bd+';">'+n2+(items.length>0?' <span style="font-weight:400;font-size:10px;">'+items.length+'명</span>':'')+'</div><div class="chg-n2-list">'+ih+'</div></div>';
    }).join('');
  }
  document.getElementById(tabsId).innerHTML=CHG_TYPES.map(t=>'<button class="chg-type-tab'+(t.key===curType?' active':'')+'" data-type="'+t.key+'">'+t.icon+' '+t.label+'</button>').join('');
  document.getElementById(tabsId).querySelectorAll('.chg-type-tab').forEach(btn=>{
    btn.addEventListener('click',()=>{
      curType=btn.dataset.type;
      document.getElementById(tabsId).querySelectorAll('.chg-type-tab').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active'); renderCols(curType);
    });
  });
  renderCols(curType);
}

    renderChangesGrid(bc,'dt-chg-cols');
    document.getElementById('dt-changes-section').classList.remove('hidden');
  }else document.getElementById('dt-changes-section').classList.add('hidden');
}

});

// ── HC 탭 함수 ──
function getIdxs(period){
  const valid=HC_DATA.months.map((m,i)=>{
    const v=HC_DATA.data['합계'][i];
    return(v!==null&&v!==undefined&&v>0)?i:-1;
  }).filter(i=>i>=0);
  if(period==='all')return valid;
  return valid.slice(-parseInt(period));
}

function deltaStr(curr,prev){
  if(prev===null||prev===undefined||curr===null||curr===undefined)return '';
  const d=curr-prev;
  if(d>0)return '<span class="td-delta delta-up">▲'+d+'</span>';
  if(d<0)return '<span class="td-delta delta-dn">▼'+Math.abs(d)+'</span>';
  return '<span class="td-delta delta-zero">-</span>';
}

function renderHC(){
  const org=document.getElementById('hc-org-select').value;
  const period=document.getElementById('hc-period-select').value;
  const idxs=getIdxs(period);
  const months=idxs.map(i=>HC_DATA.months[i]);
  const vals=idxs.map(i=>HC_DATA.data[org]?.[i]??null);
  const validVals=vals.filter(v=>v!==null);
  const latest=validVals.at(-1);
  const prev1=validVals.at(-2);
  const latestIdx=idxs[vals.map((v,i)=>v!==null?i:-1).filter(i=>i>=0).at(-1)];
  const prevYearVal=latestIdx>=12?(HC_DATA.data[org]?.[latestIdx-12]??null):null;
  const mom=(latest!=null&&prev1!=null)?latest-prev1:null;
  const yoy=(latest!=null&&prevYearVal!=null)?latest-prevYearVal:null;
  const momPct=(mom!=null&&prev1>0)?(mom/prev1*100).toFixed(1):null;
  const yoyPct=(yoy!=null&&prevYearVal>0)?(yoy/prevYearVal*100).toFixed(1):null;
  function cardDelta(d,pct){
    if(d===null)return '';
    const cls=d>0?'delta-up':d<0?'delta-dn':'delta-zero';
    const sign=d>0?'▲':d<0?'▼':'';
    return '<div class="hc-sum-delta '+cls+'">'+sign+Math.abs(d)+'명'+(pct!==null?' ('+(d>0?'+':'')+pct+'%)':'')+'</div>';
  }
  document.getElementById('hc-summary-row').innerHTML=
    '<div class="hc-sum-card"><div class="hc-sum-label">최신 ('+(months.at(-1)||'-')+')</div><div class="hc-sum-val">'+(latest??'-')+'명</div></div>'+
    '<div class="hc-sum-card"><div class="hc-sum-label">전월 대비</div><div class="hc-sum-val" style="font-size:17px;">'+(mom!==null?(mom>=0?'+':'')+mom+'명':'-')+'</div>'+cardDelta(mom,momPct)+'</div>'+
    '<div class="hc-sum-card"><div class="hc-sum-label">전년 동월 대비</div><div class="hc-sum-val" style="font-size:17px;">'+(yoy!==null?(yoy>=0?'+':'')+yoy+'명':'-')+'</div>'+cardDelta(yoy,yoyPct)+'</div>'+
    '<div class="hc-sum-card"><div class="hc-sum-label">최고 / 최저</div><div class="hc-sum-val" style="font-size:15px;">'+(validVals.length?Math.max(...validVals)+' / '+Math.min(...validVals)+'명':'-')+'</div></div>';
  document.getElementById('hc-chart-title').textContent=org+' HC 추이';
  drawHCChart(months,vals,idxs);
  const n1Info=HC_DATA.n1_orgs.find(g=>g.name===org)||{name:org,children:[],color:'#111',light:'#fff',border:'#ddd'};
  const thCols=months.map(m=>'<th>'+m.replace('년 ','<br>')+'</th>').join('');
  let html='<thead><tr><th>조직</th>'+thCols+'</tr></thead><tbody>';
  html+='<tr class="n1-row" style="background:'+n1Info.light+';">';
  html+='<td style="color:'+n1Info.color+';">'+org+'</td>';
  idxs.forEach((idx,vi)=>{
    const v=HC_DATA.data[org]?.[idx]??null;
    const prev=vi>0?(HC_DATA.data[org]?.[idxs[vi-1]]??null):null;
    html+='<td style="color:'+n1Info.color+';font-weight:700;">'+(v??'-')+(v!==null?deltaStr(v,prev):'')+'</td>';
  });
  html+='</tr>';
  (n1Info.children||[]).forEach(child=>{
    html+='<tr class="n2-row"><td>'+child+'</td>';
    idxs.forEach((idx,vi)=>{
      const v=HC_DATA.data[child]?.[idx]??null;
      const prev=vi>0?(HC_DATA.data[child]?.[idxs[vi-1]]??null):null;
      html+='<td>'+(v??'-')+(v!==null?deltaStr(v,prev):'')+'</td>';
    });
    html+='</tr>';
  });
  html+='</tbody>';
  document.getElementById('hc-table').innerHTML=html;
}

function drawHCChart(months,vals,idxs){
  const canvas=document.getElementById('hc-canvas');
  const dpr=window.devicePixelRatio||1;
  const rect=canvas.parentElement.getBoundingClientRect();
  canvas.width=rect.width*dpr; canvas.height=220*dpr;
  canvas.style.width=rect.width+'px'; canvas.style.height='220px';
  const ctx=canvas.getContext('2d');
  ctx.scale(dpr,dpr);
  const W=rect.width,H=220;
  const PAD={left:44,right:20,top:20,bottom:44};
  const cW=W-PAD.left-PAD.right,cH=H-PAD.top-PAD.bottom;
  ctx.clearRect(0,0,W,H);
  const validVals=vals.filter(v=>v!==null);
  if(!validVals.length)return;
  const minV=Math.min(...validVals),maxV=Math.max(...validVals);
  const vRange=(maxV-minV)||1;
  const vMin=Math.max(0,minV-Math.ceil(vRange*0.15)),vMax=maxV+Math.ceil(vRange*0.15),vR=vMax-vMin||1;
  const toX=i=>PAD.left+(i/(months.length-1||1))*cW;
  const toY=v=>PAD.top+(1-(v-vMin)/vR)*cH;
  ctx.strokeStyle='#F0EEE9'; ctx.lineWidth=1;
  [0,1,2,3,4].forEach(s=>{
    const y=toY(vMin+(vR/4)*s);
    ctx.beginPath();ctx.moveTo(PAD.left,y);ctx.lineTo(W-PAD.right,y);ctx.stroke();
    ctx.fillStyle='#aaa';ctx.font='10px Arial';ctx.textAlign='right';
    ctx.fillText(Math.round(vMin+(vR/4)*s),PAD.left-4,y+4);
  });
  months.forEach((m,i)=>{
    if(HC_DATA.memos[m]&&vals[i]!==null){
      ctx.strokeStyle='rgba(251,191,36,0.4)';ctx.lineWidth=1.5;ctx.setLineDash([4,3]);
      ctx.beginPath();ctx.moveTo(toX(i),PAD.top);ctx.lineTo(toX(i),H-PAD.bottom);ctx.stroke();
      ctx.setLineDash([]);
    }
  });
  const grad=ctx.createLinearGradient(0,PAD.top,0,PAD.top+cH);
  grad.addColorStop(0,'rgba(37,99,235,0.12)');grad.addColorStop(1,'rgba(37,99,235,0)');
  ctx.beginPath(); let started=false;
  months.forEach((m,i)=>{
    if(vals[i]===null)return;
    !started?(ctx.moveTo(toX(i),toY(vals[i])),started=true):ctx.lineTo(toX(i),toY(vals[i]));
  });
  const lv=months.map((m,i)=>vals[i]!==null?i:-1).filter(i=>i>=0);
  if(lv.length){
    ctx.lineTo(toX(lv.at(-1)),PAD.top+cH);ctx.lineTo(toX(lv[0]),PAD.top+cH);
    ctx.closePath();ctx.fillStyle=grad;ctx.fill();
  }
  ctx.strokeStyle='#2563EB';ctx.lineWidth=2.5;ctx.lineJoin='round';
  ctx.beginPath();started=false;
  months.forEach((m,i)=>{
    if(vals[i]===null){started=false;return;}
    !started?(ctx.moveTo(toX(i),toY(vals[i])),started=true):ctx.lineTo(toX(i),toY(vals[i]));
  });
  ctx.stroke();
  _hcPoints=[];
  months.forEach((m,i)=>{
    if(vals[i]===null)return;
    const x=toX(i),y=toY(vals[i]),hasMemo=!!HC_DATA.memos[m];
    ctx.beginPath();ctx.arc(x,y,hasMemo?6:3.5,0,Math.PI*2);
    ctx.fillStyle=hasMemo?'#F59E0B':'#2563EB';ctx.fill();
    if(hasMemo){ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.stroke();}
    _hcPoints.push({x,y,month:m,val:vals[i],hasMemo});
  });
  ctx.fillStyle='#888';ctx.font='9px Arial';ctx.textAlign='center';
  const step=months.length<=12?1:2;
  months.forEach((m,i)=>{
    if(i%step!==0&&i!==months.length-1)return;
    const lbl=m.slice(2).replace('년 ','년 ');
    ctx.fillText(lbl,toX(i),H-PAD.bottom+14);
  });
  ctx.beginPath();ctx.arc(PAD.left+4,PAD.top-6,4,0,Math.PI*2);
  ctx.fillStyle='#F59E0B';ctx.fill();
  ctx.fillStyle='#666';ctx.font='9px Arial';ctx.textAlign='left';
  ctx.fillText('📌 특이사항 달 (클릭하여 메모 확인)',PAD.left+12,PAD.top-3);
  canvas.style.cursor='default';
  canvas.onclick=function(e){
    const r=canvas.getBoundingClientRect();
    const mx=e.clientX-r.left,my=e.clientY-r.top;
    const popup=document.getElementById('hc-memo-popup');
    let hit=null;
    for(const p of _hcPoints){
      if(p.hasMemo&&Math.sqrt((p.x-mx)**2+(p.y-my)**2)<14){hit=p;break;}
    }
    if(hit){
      document.getElementById('hc-popup-month').textContent=hit.month;
      document.getElementById('hc-popup-text').textContent=HC_DATA.memos[hit.month]||'';
      let left=hit.x+16,top=hit.y-30;
      if(left+270>W)left=hit.x-286;
      if(top<0)top=4;
      popup.style.left=left+'px';popup.style.top=top+'px';
      popup.classList.add('visible');
    }else{
      popup.classList.remove('visible');
    }
  };
  canvas.onmousemove=function(e){
    const r=canvas.getBoundingClientRect();
    const mx=e.clientX-r.left,my=e.clientY-r.top;
    let on=false;
    for(const p of _hcPoints){
      if(p.hasMemo&&Math.sqrt((p.x-mx)**2+(p.y-my)**2)<14){on=true;break;}
    }
    canvas.style.cursor=on?'pointer':'default';
  };
}

window.addEventListener('resize',()=>{
  if(document.getElementById('hc-view').classList.contains('active'))renderHC();
});
